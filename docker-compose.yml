services:
  mongo:
    image: mongo:7
    container_name: refoond-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - refoond-mongo-data:/data/db

  mongo-express:
    image: mongo-express
    container_name: refoond-mongo-express
    restart: unless-stopped
    ports:
      - "8084:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_BASICAUTH: "false"


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: refoond-backend
    restart: unless-stopped
    ports:
      - "5050:5050"
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
      PORT: 5050
      MONGODB_URI: mongodb://mongo:27017/refoond
      JWT_SECRET: dev_jwt_secret_key_1234567890_change_me
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: gemini-2.5-flash-lite
      CLIENT_URL: http://localhost:5173
      SERVER_URL: http://localhost:5050
      CORS_ORIGIN: http://localhost:5173
    depends_on:
      - mongo

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: refoond-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_BACKEND_URL: http://backend:5050
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    depends_on:
      - backend

volumes:
  refoond-mongo-data: